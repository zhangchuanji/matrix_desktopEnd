<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Shell Browser</title>
  <style>
    :root {
      /* 蓝白色主题 - 匹配图片样式 */
      --bg-color: #ffffff;
      /* 白色背景 */
      --text-color: #333333;
      /* 深灰色文字 */
      --tab-color: #f9fafb;
      /* 浅蓝色标签栏 */
      --toolbar-control-color: #4a90e2;
      /* 蓝色按钮 */

      /* electron-chrome-extensions colors */
      --browser-action-badge-outline: var(--tab-color);
    }

    *,
    *:before,
    *:after {
      box-sizing: border-box;
      user-select: none;
    }

    html {
      background: var(--tab-color);
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu", "Droid Sans", sans-serif;
      font-size: 16px;
      color: var(--text-color);
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .topbar {
      background: #f3f4f6;
    }

    /*----- TABS -----*/

    #tabstrip {
      width: 100%;
      height: calc(env(titlebar-area-height, 37px) + 5px);
    }

    .tab-container {
      position: fixed;
      left: env(titlebar-area-x);
      top: env(titlebar-area-y);
      width: env(titlebar-area-width);
      height: calc(env(titlebar-area-height, 37px) + 5px);
      display: flex;
      flex-direction: row;
    }

    .tab-list {
      height: 100%;
      display: flex;
      flex-direction: row;
      min-width: 0;
    }

    #createtab {
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      color: #333;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    #createtab:hover {
      background: #dadada;
    }

    .tab {
      padding: 0.2rem 0.4rem;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      width: 12rem;
    }

    .tab[data-active] {
      background: var(--bg-color);
    }

    .tab .favicon[src] {
      display: none;
      width: 16px;
      height: 16px;
      margin-right: 0.2rem;
    }

    .tab .favicon[src].loaded {
      display: block;
    }

    .tab .title {
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 0;
      text-overflow: ellipsis;
      overflow: hidden;
      font-size: 0.725rem;
      user-select: none;
    }

    .tab .controls {
      flex: 0 0 auto;
      font-size: 0;
    }

    .tab .controls .control {
      background: transparent;
      border: none;
      padding: 0;
      margin-left: 0.2rem;
      width: 1rem;
      height: 1rem;
      color: #aaa;
      font-size: 0.7rem;
      vertical-align: middle;
      line-height: 0;
      cursor: pointer;

      &:hover {
        background: #dfdfdf;
        border-radius: 50%;
      }

      .closeImg {
        width: 100%;
        height: 100%;
      }
    }

    .tab .controls .control:disabled {
      display: none;
    }

    .app-drag {
      flex: 1 0 auto;
      -webkit-app-region: drag;
      height: calc(100% - 5px);
      min-width: 2rem;
      align-self: flex-end;
    }

    .window-controls {
      display: none;
      flex-direction: row;
      flex: 0 0 auto;
    }

    .platform-linux .window-controls {
      display: flex;
    }

    .window-controls .control {
      width: 2.5rem;
      background: none;
      border: none;
      color: #fff;
    }

    .window-controls .control:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /*----- TOOLBAR -----*/

    .toolbar {
      height: 42px;
      background-color: var(--tab-color);
      display: flex;
      align-items: center;
      padding: 0.31rem 0.5rem;
    }

    .toolbar .page-controls {
      margin-right: 0.5rem;
      display: flex;
      align-items: center;
      gap: .7rem;
    }

    .address-bar {
      flex: 1 0 auto;
      line-height: 0;
      height: 100%;
      border-radius: .5rem;
    }

    .address-bar .input-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      border: 1px solid transparent;
      border-radius: .5rem;
    }

    .address-bar .input-container:hover,
    .address-bar .input-container:focus-within {
      border: 1px solid var(--toolbar-control-color);
      border-radius: .5rem;
    }

    .address-bar .address-icon {
      position: absolute;
      left: 0.75rem;
      width: 1rem;
      height: 1rem;
      z-index: 1;
      opacity: 0.6;
    }

    .address-bar .input-container input {
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      color: var(--text-color);
      border: none;
      border-radius: .5rem;
      padding: 0 0.5rem 0 2.5rem;
      /* 左侧留出图标空间 */
      outline: none;
    }

    .address-bar input {
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      color: var(--text-color);
      border: none;
      border-radius: .5rem;
      padding: 0 0.5rem;
      outline: none;
    }

    .controlBox {
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;

      &:hover {
        background: #dfdfdf;
        border-radius: 8px;
      }
    }

    .toolbar .control1 {
      background: none;
      border: none;
      width: 1.2rem;
      height: 1.2rem;
      padding: 0;
      line-height: 0;
      cursor: pointer;

      &:active {
        transform: scale(0.9);
      }
    }

    .toolbar .control2 {
      background: none;
      border: none;
      width: .98rem;
      height: .98rem;
      padding: 0;
      line-height: 0;
      cursor: pointer;

      &:active {
        transform: scale(0.9);
      }
    }

    /* Save Account Button Styles */
    .save-account-btn {
      background: var(--toolbar-control-color);
      border: none;
      border-radius: 0.25rem;
      color: var(--bg-color);
      font-size: 0.75rem;
      font-weight: bold;
      height: 1.5rem;
      margin-left: 0.5rem;
      padding: 0 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .save-account-btn:hover {
      background: #e0a3d9;
    }

    .save-account-btn:active {
      background: #c589be;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div id="tabstrip">
      <div class="tab-container">
        <ul class="tab-list">
          <template id="tabtemplate">
            <li class="tab">
              <img class="favicon" />
              <span class="title"></span>
              <div class="controls">
                <button class="control audio" disabled>🔊</button>
                <button class="control close">
                  <img class="closeImg" src="http://36.141.100.123:10013/glks/20250902/close_1756808783760.png" alt="">
                </button>
              </div>
            </li>
          </template>
        </ul>
        <button id="createtab">+</button>
        <div class="app-drag"></div>
        <div class="window-controls">
          <button id="minimize" class="control">🗕</button>
          <button id="maximize" class="control">🗖</button>
          <button id="close" class="control">🗙</button>
        </div>
      </div>
    </div>
    <!-- 工具栏片段 -->
    <div id="toolbar" class="toolbar">
      <div class="page-controls">
        <div class="controlBox">
          <img class="control1" id="goback" src="http://36.141.100.123:10013/glks/20250903/左_left_1756862456159.png"
            alt="">
        </div>
        <div class="controlBox">
          <img class="control1" id="goforward" src="http://36.141.100.123:10013/glks/20250903/右_right_1756862435730.png"
            alt="">
        </div>
        <div class="controlBox">
          <img class="control2" id="reload" src="http://36.141.100.123:10013/glks/20250902/refresh_1756808794766.png"
            alt="">
        </div>
        <!-- <img class="control" id="reload" src="http://36.141.100.123:10013/glks/20250902/close_1756808783760.png" alt=""> -->
      </div>
      <div class="address-bar">
        <div class="input-container">
          <img class="address-icon" src="http://36.141.100.123:10013/glks/20250903/webPage_1756864055284.png" alt="搜索">
          <input id="addressurl" spellcheck="false" />
        </div>
      </div>
      <button id="saveaccount" class="save-account-btn">保存账号</button>
      <browser-action-list id="actions" alignment="bottom left"></browser-action-list>
    </div>
  </div>
  </div>
  <script src="./webui.js"></script>
</body>

</html>
